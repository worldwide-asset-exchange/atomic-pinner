name: Release

# Cut a release by pushing a SemVer tag that matches package.json:
#   yarn version --new-version 0.3.0   # bumps package.json and creates the tag
#   git push --follow-tags
# Publishes @waxio/atomic-pinner to npm through trusted publishing (OIDC, no stored token;
# the publisher is registered on npmjs.com for this repo + this workflow file) and a
# multi-arch image to ghcr.io/worldwide-asset-exchange/atomic-pinner.
#
# Actions are pinned to commit SHAs because this workflow can publish; Dependabot bumps them.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "package.json is $pkg but the tag is ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - run: yarn typecheck
      - run: yarn prettier:check
      - run: yarn docs:check
      - run: yarn test:coverage
      - run: yarn build

  npm:
    needs: verify
    runs-on: ubuntu-latest
    # The "npm" environment can require a reviewer: Settings → Environments → npm.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@waxio/atomic-pinner
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn
          registry-url: https://registry.npmjs.org
      - run: yarn install --frozen-lockfile
      - name: npm 11.5.1 or newer (trusted publishing support)
        run: npm install -g npm@11 && npm --version
      - name: Publish to npm
        run: npm publish --access public

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    needs: [npm, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Extract this version's changelog section
        run: |
          awk -v tag="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; if (index($0, "## " tag) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "See CHANGELOG.md." > release-notes.md; fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release-notes.md
